aid: long-term-stock-exchange
name: Long-Term Stock Exchange
description: >-
  The Long-Term Stock Exchange (LTSE) is a U.S. Securities and Exchange Commission-registered
  national securities exchange headquartered in New York, built to support companies and investors
  committed to long-term value creation. LTSE operates a principles-based equities trading platform
  that accepts order entry over the MEMO FIX and MEMO SBE (Simple Binary Encoding) protocols and
  distributes real-time market data - depth of book, top of book, and last sale - via the MEMOIR
  multicast feed. Beyond the exchange it offers private-markets and cap-table software plus long-term
  listing standards. LTSE does not publish a public REST/OpenAPI developer API; participant
  connectivity (Direct, Extranet, Telco via NY4) and technical specifications are provided through
  its Market Operations team.
